<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>O Fugitivo - Labirinto das Chaves</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', 'VT323', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #000000aa;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 4px #f5d742, 0 0 0 8px #2c1e0f;
            border-radius: 12px;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background-color: #010014;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            margin-bottom: 8px;
            gap: 20px;
            flex-wrap: wrap;
            background: #1e1a2fcc;
            padding: 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .keys-status {
            background: #000000aa;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #ffd966;
            text-shadow: 0 0 3px #ffaa33;
        }

        .message {
            background: #2a2418;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #f3c26f;
            font-family: monospace;
        }

        button {
            background: #f5bc70;
            border: none;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #8b5a2b;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #8b5a2b;
        }

        .controls-hint {
            font-size: 0.8rem;
            background: #00000099;
            padding: 4px 12px;
            border-radius: 20px;
        }

        @keyframes pulse {
            0% { opacity: 0.7; text-shadow: 0 0 0 yellow; }
            100% { opacity: 1; text-shadow: 0 0 6px gold; }
        }
        .victory {
            animation: pulse 0.6s infinite alternate;
            color: #ffdd88;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="640"></canvas>
        <div class="info-panel">
            <div class="keys-status">🔑 CHAVES: <span id="keyCounter">0</span> / 4</div>
            <div class="message" id="gameMessage">🔓 Colete 4 chaves e fuja pela porta!</div>
            <button id="resetButton">🔄 REINICIAR</button>
        </div>
        <div class="controls-hint">🎮 SETAS (↑ ↓ ← →) → MOVER | ⚡ Perseguidores: 👮🏼‍♂️(Chaser), 👮🏻(Defensor), 👮🏽‍♂️(Atacante), 👮‍♂️(Andarilho)</div>
    </div>
</div>

<script>
    (function(){
        // ---------------------- MAPA EM GRADE -------------------------
        const rawGrid = [
            "[#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#]",
            "[#][#][.][.][.][#][#][#][#][.][.][.][.][.][.][.][.][D][#][#]",
            "[#][#][.][#][.][#][#][#][.][.][.][#][#][.][#][#][#][.][#][#]",
            "[#][#][.][#][.][.][.][A][.][#][#][#][#][.][#][#][#][C][#]",
            "[#][#][.][#][#][#][#][.][.][.][.][C][.][.][#][#][#][.][#][#]",
            "[#][J][.][#][.][.][.][.][#][#][#][.][#][#][#][#][#][P][S][#]",
            "[#][#][.][#][.][#][.][.][.][.][.][.][.][.][#][#][.][.][#]",
            "[#][#][.][#][C][#][.][#][#][#][.][#][#][.][.][.][.][#][#][#]",
            "[#][#][.][#][#][#][.][#][#][#][.][#][#][#][#][#][.][#][#][#]",
            "[#][#][.][.][.][.][.][.][.][.][.][.][.][.][.][W][.][#][#][#]",
            "[#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#][#]"
        ];
        
        function parseGridToMap(grid) {
            const map = [];
            for (let line of grid) {
                let cells = line.split('][').map(cell => cell.replace(/[\[\]]/g, ''));
                if (cells.length !== 20) {
                    while(cells.length < 20) cells.push('#');
                    if(cells.length > 20) cells = cells.slice(0,20);
                }
                map.push(cells);
            }
            return map;
        }
        
        const charMap = parseGridToMap(rawGrid);
        const ROWS = charMap.length;
        const COLS = charMap[0].length;
        const TILE_SIZE = 40;
        
        const canvas = document.getElementById('gameCanvas');
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;
        const ctx = canvas.getContext('2d');
        
        let wallGrid = Array(ROWS).fill().map(()=>Array(COLS).fill(false));
        let keysGrid = Array(ROWS).fill().map(()=>Array(COLS).fill(false));
        let doorPos = {x:-1, y:-1};
        let doorUnlocked = false;
        let keysCollected = 0;
        
        let playerStart = {x:0, y:0};
        let enemySpawns = {
            chaser: null,
            defender: null,
            attacker: null,
            wanderer: null
        };
        
        let keyPositions = [];
        let player = {x: 0, y: 0};
        
        // Histórico de posições do jogador para o atacante seguir os passos
        let playerPathHistory = [];
        const MAX_PATH_HISTORY = 30;
        
        const ENEMY_TYPES = {
            CHASER: 0,
            DEFENDER: 1,
            ATTACKER: 2,
            WANDERER: 3
        };
        
        const ENEMY_EMOJIS = {
            [ENEMY_TYPES.CHASER]: "👮🏼‍♂️",
            [ENEMY_TYPES.DEFENDER]: "👮🏻",
            [ENEMY_TYPES.ATTACKER]: "👮🏽‍♂️",
            [ENEMY_TYPES.WANDERER]: "👮‍♂️"
        };
        
        const PLAYER_EMOJI = "🧍🏻";
        
        // Velocidades mais lentas para todos os inimigos
        const ENEMY_SPEED_DELAY = {
            [ENEMY_TYPES.CHASER]: 350,
            [ENEMY_TYPES.DEFENDER]: 500,
            [ENEMY_TYPES.ATTACKER]: 400,
            [ENEMY_TYPES.WANDERER]: 480
        };
        
        class Enemy {
            constructor(x, y, type, id){
                this.x = x;
                this.y = y;
                this.type = type;
                this.id = id;
                this.lastMoveDir = null;
                this.stuckCounter = 0;
                this.lastPos = {x: x, y: y};
                this.patrolIndex = 0;
                this.patrolPoints = [];
                this.lastMoveTime = 0;
            }
        }
        
        let enemies = [];
        let gameActive = true;
        let victory = false;
        let gameOverFlag = false;
        
        function loadMapFromDefinition(){
            wallGrid = Array(ROWS).fill().map(()=>Array(COLS).fill(false));
            keysGrid = Array(ROWS).fill().map(()=>Array(COLS).fill(false));
            keyPositions = [];
            enemySpawns = { chaser: null, defender: null, attacker: null, wanderer: null };
            
            for(let row = 0; row < ROWS; row++){
                for(let col = 0; col < COLS; col++){
                    const ch = charMap[row][col];
                    
                    if(ch === '#') {
                        wallGrid[row][col] = true;
                    }
                    else if(ch === 'C') {
                        keysGrid[row][col] = true;
                        keyPositions.push({x: col, y: row});
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'S') {
                        doorPos = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'J') {
                        playerStart = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'P') {
                        enemySpawns.chaser = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'D') {
                        enemySpawns.defender = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'A') {
                        enemySpawns.attacker = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === 'W') {
                        enemySpawns.wanderer = {x: col, y: row};
                        wallGrid[row][col] = false;
                    }
                    else if(ch === '.') {
                        wallGrid[row][col] = false;
                    }
                }
            }
            
            if(keyPositions.length < 4){
                for(let i = keyPositions.length; i < 4; i++){
                    for(let r=0; r<ROWS && keyPositions.length<4; r++){
                        for(let c=0; c<COLS; c++){
                            if(!wallGrid[r][c] && !(c===doorPos.x && r===doorPos.y) && !keysGrid[r][c] && !(playerStart.x===c && playerStart.y===r)){
                                let isEnemySpawn = false;
                                for(let key in enemySpawns){
                                    if(enemySpawns[key] && enemySpawns[key].x === c && enemySpawns[key].y === r) isEnemySpawn = true;
                                }
                                if(!isEnemySpawn){
                                    keysGrid[r][c] = true;
                                    keyPositions.push({x:c, y:r});
                                    break;
                                }
                            }
                        }
                    }
                }
            }
        }
        
        // Gerar pontos de patrulha DISTANTES da porta (raio 5-8)
        function generatePatrolPoints(defender) {
            const patrolPoints = [];
            const centerX = doorPos.x;
            const centerY = doorPos.y;
            
            for(let dx = -8; dx <= 8; dx++) {
                for(let dy = -8; dy <= 8; dy++) {
                    let dist = Math.abs(dx) + Math.abs(dy);
                    if(dist >= 5 && dist <= 10) {
                        let nx = centerX + dx;
                        let ny = centerY + dy;
                        if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !wallGrid[ny][nx] && !(nx === doorPos.x && ny === doorPos.y)) {
                            let distToDoor = Math.abs(nx - doorPos.x) + Math.abs(ny - doorPos.y);
                            if(distToDoor >= 4) {
                                patrolPoints.push({x: nx, y: ny});
                            }
                        }
                    }
                }
            }
            
            for(let i = patrolPoints.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [patrolPoints[i], patrolPoints[j]] = [patrolPoints[j], patrolPoints[i]];
            }
            
            if(patrolPoints.length === 0) {
                for(let r=0; r<ROWS; r++) {
                    for(let c=0; c<COLS; c++) {
                        if(!wallGrid[r][c] && !(c===doorPos.x && r===doorPos.y)) {
                            let distToDoor = Math.abs(c - doorPos.x) + Math.abs(r - doorPos.y);
                            if(distToDoor >= 4) {
                                patrolPoints.push({x: c, y: r});
                            }
                        }
                    }
                }
            }
            
            return patrolPoints;
        }
        
        function initGame(){
            loadMapFromDefinition();
            
            player.x = playerStart.x;
            player.y = playerStart.y;
            playerPathHistory = [{x: player.x, y: player.y}];
            
            enemies = [];
            if(enemySpawns.chaser) enemies.push(new Enemy(enemySpawns.chaser.x, enemySpawns.chaser.y, ENEMY_TYPES.CHASER, 0));
            if(enemySpawns.defender) {
                let def = new Enemy(enemySpawns.defender.x, enemySpawns.defender.y, ENEMY_TYPES.DEFENDER, 1);
                def.patrolPoints = generatePatrolPoints(def);
                let distToDoor = Math.abs(def.x - doorPos.x) + Math.abs(def.y - doorPos.y);
                if(distToDoor < 5 && def.patrolPoints.length > 0) {
                    let spawnPoint = def.patrolPoints[Math.floor(Math.random() * def.patrolPoints.length)];
                    def.x = spawnPoint.x;
                    def.y = spawnPoint.y;
                }
                enemies.push(def);
            }
            if(enemySpawns.attacker) enemies.push(new Enemy(enemySpawns.attacker.x, enemySpawns.attacker.y, ENEMY_TYPES.ATTACKER, 2));
            if(enemySpawns.wanderer) enemies.push(new Enemy(enemySpawns.wanderer.x, enemySpawns.wanderer.y, ENEMY_TYPES.WANDERER, 3));
            
            const neededTypes = [
                {type: ENEMY_TYPES.CHASER, name: "chaser"},
                {type: ENEMY_TYPES.DEFENDER, name: "defender"},
                {type: ENEMY_TYPES.ATTACKER, name: "attacker"},
                {type: ENEMY_TYPES.WANDERER, name: "wanderer"}
            ];
            
            for(let needed of neededTypes){
                let exists = enemies.some(e => e.type === needed.type);
                if(!exists){
                    for(let r=0; r<ROWS; r++){
                        let placed = false;
                        for(let c=0; c<COLS; c++){
                            if(!wallGrid[r][c] && !(c===player.x && r===player.y) && !(c===doorPos.x && r===doorPos.y)){
                                let isKey = keysGrid[r][c];
                                if(!isKey){
                                    let newEnemy = new Enemy(c, r, needed.type, enemies.length);
                                    if(needed.type === ENEMY_TYPES.DEFENDER) {
                                        newEnemy.patrolPoints = generatePatrolPoints(newEnemy);
                                    }
                                    enemies.push(newEnemy);
                                    placed = true;
                                    break;
                                }
                            }
                        }
                        if(placed) break;
                    }
                }
            }
            
            doorUnlocked = false;
            keysCollected = 0;
            gameActive = true;
            victory = false;
            gameOverFlag = false;
            
            document.getElementById("gameMessage").innerHTML = "🔓 Colete 4 chaves e fuja pela porta!";
            document.getElementById("gameMessage").classList.remove("victory");
            updateKeyUI();
        }
        
        function updateKeyUI(){
            document.getElementById("keyCounter").innerText = keysCollected;
        }
        
        function isCollisionSolid(tx, ty){
            if(tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return true;
            if(wallGrid[ty][tx]) return true;
            if(tx === doorPos.x && ty === doorPos.y && !doorUnlocked) return true;
            return false;
        }
        
        function tryMovePlayer(dx, dy){
            if(!gameActive || victory || gameOverFlag) return false;
            let newX = player.x + dx;
            let newY = player.y + dy;
            if(!isCollisionSolid(newX, newY)){
                player.x = newX;
                player.y = newY;
                
                playerPathHistory.unshift({x: player.x, y: player.y});
                if(playerPathHistory.length > MAX_PATH_HISTORY) {
                    playerPathHistory.pop();
                }
                
                if(keysGrid[newY][newX]){
                    keysGrid[newY][newX] = false;
                    keysCollected++;
                    updateKeyUI();
                    if(keysCollected === 4){
                        doorUnlocked = true;
                        document.getElementById("gameMessage").innerHTML = "✨ PORTA DESTRANCADA! CORRA PARA A SAÍDA! ✨";
                    }
                }
                
                if(doorUnlocked && newX === doorPos.x && newY === doorPos.y){
                    victory = true;
                    gameActive = false;
                    document.getElementById("gameMessage").innerHTML = "🏆 VOCÊ ESCAPOU! VITÓRIA! 🏆";
                    document.getElementById("gameMessage").classList.add("victory");
                }
                return true;
            }
            return false;
        }
        
        function getManhattanDist(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2);}
        
        function getValidDirections(x, y) {
            const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
            const valid = [];
            for(let [dx, dy] of dirs) {
                if(!isCollisionSolid(x+dx, y+dy)) {
                    valid.push([dx, dy]);
                }
            }
            return valid;
        }
        
        function moveEnemyChaser(e){
            let validDirs = getValidDirections(e.x, e.y);
            if(validDirs.length === 0) return;
            
            let bestDir = null;
            let bestDist = Infinity;
            for(let [dx, dy] of validDirs){
                let nx = e.x+dx, ny = e.y+dy;
                let dist = getManhattanDist(nx, ny, player.x, player.y);
                if(dist < bestDist){
                    bestDist = dist;
                    bestDir = [dx, dy];
                }
            }
            if(bestDir){
                e.x += bestDir[0];
                e.y += bestDir[1];
            } else {
                let randomDir = validDirs[Math.floor(Math.random() * validDirs.length)];
                e.x += randomDir[0];
                e.y += randomDir[1];
            }
        }
        
        function moveEnemyDefender(e){
            if(!e.patrolPoints || e.patrolPoints.length === 0) {
                e.patrolPoints = generatePatrolPoints(e);
            }
            if(e.patrolPoints.length === 0) {
                let validDirs = getValidDirections(e.x, e.y);
                if(validDirs.length > 0) {
                    let chosen = validDirs[Math.floor(Math.random() * validDirs.length)];
                    e.x += chosen[0];
                    e.y += chosen[1];
                }
                return;
            }
            
            let distToDoor = getManhattanDist(e.x, e.y, doorPos.x, doorPos.y);
            if(distToDoor < 5) {
                let validDirs = getValidDirections(e.x, e.y);
                if(validDirs.length > 0) {
                    let bestDir = null;
                    let bestDist = -Infinity;
                    for(let [dx, dy] of validDirs){
                        let nx = e.x+dx, ny = e.y+dy;
                        let newDist = getManhattanDist(nx, ny, doorPos.x, doorPos.y);
                        if(newDist > bestDist){
                            bestDist = newDist;
                            bestDir = [dx, dy];
                        }
                    }
                    if(bestDir){
                        e.x += bestDir[0];
                        e.y += bestDir[1];
                        return;
                    }
                }
            }
            
            let target = e.patrolPoints[e.patrolIndex];
            
            if(getManhattanDist(e.x, e.y, target.x, target.y) <= 1) {
                e.patrolIndex = (e.patrolIndex + 1) % e.patrolPoints.length;
                target = e.patrolPoints[e.patrolIndex];
            }
            
            let validDirs = getValidDirections(e.x, e.y);
            if(validDirs.length === 0) return;
            
            let bestDir = null;
            let bestDist = Infinity;
            for(let [dx, dy] of validDirs){
                let nx = e.x+dx, ny = e.y+dy;
                let dist = getManhattanDist(nx, ny, target.x, target.y);
                if(dist < bestDist){
                    bestDist = dist;
                    bestDir = [dx, dy];
                }
            }
            
            if(bestDir){
                e.x += bestDir[0];
                e.y += bestDir[1];
            } else {
                let randomDir = validDirs[Math.floor(Math.random() * validDirs.length)];
                e.x += randomDir[0];
                e.y += randomDir[1];
            }
        }
        
        function moveEnemyAttacker(e){
            if(playerPathHistory.length > 1) {
                let targetIndex = Math.min(playerPathHistory.length - 1, 3);
                let target = playerPathHistory[targetIndex];
                
                let validDirs = getValidDirections(e.x, e.y);
                if(validDirs.length === 0) return;
                
                let bestDir = null;
                let bestDist = Infinity;
                for(let [dx, dy] of validDirs){
                    let nx = e.x+dx, ny = e.y+dy;
                    let dist = getManhattanDist(nx, ny, target.x, target.y);
                    if(dist < bestDist){
                        bestDist = dist;
                        bestDir = [dx, dy];
                    }
                }
                
                if(bestDir){
                    e.x += bestDir[0];
                    e.y += bestDir[1];
                    return;
                }
            }
            
            moveEnemyChaser(e);
        }
        
        function moveEnemyWanderer(e){
            let validDirs = getValidDirections(e.x, e.y);
            if(validDirs.length === 0) return;
            
            if(e.x === e.lastPos.x && e.y === e.lastPos.y){
                e.stuckCounter++;
            } else {
                e.stuckCounter = 0;
            }
            e.lastPos = {x: e.x, y: e.y};
            
            let chosenDir;
            if(e.stuckCounter > 3 && e.lastMoveDir){
                let differentDirs = validDirs.filter(([dx, dy]) => {
                    return !(dx === e.lastMoveDir[0] && dy === e.lastMoveDir[1]);
                });
                if(differentDirs.length > 0){
                    chosenDir = differentDirs[Math.floor(Math.random() * differentDirs.length)];
                    e.stuckCounter = 0;
                } else {
                    chosenDir = validDirs[Math.floor(Math.random() * validDirs.length)];
                }
            } else {
                chosenDir = validDirs[Math.floor(Math.random() * validDirs.length)];
            }
            
            e.x += chosenDir[0];
            e.y += chosenDir[1];
            e.lastMoveDir = chosenDir;
        }
        
        function updateEnemies(currentTime){
            for(let e of enemies){
                if(!gameActive || victory) break;
                
                const delay = ENEMY_SPEED_DELAY[e.type];
                if(currentTime - e.lastMoveTime < delay) continue;
                e.lastMoveTime = currentTime;
                
                switch(e.type){
                    case ENEMY_TYPES.CHASER: moveEnemyChaser(e); break;
                    case ENEMY_TYPES.DEFENDER: moveEnemyDefender(e); break;
                    case ENEMY_TYPES.ATTACKER: moveEnemyAttacker(e); break;
                    case ENEMY_TYPES.WANDERER: moveEnemyWanderer(e); break;
                }
                if(!victory && gameActive && e.x === player.x && e.y === player.y){
                    gameActive = false;
                    gameOverFlag = true;
                    document.getElementById("gameMessage").innerHTML = "💀 VOCÊ FOI PEGO! GAME OVER 💀";
                }
            }
        }
        
        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            for(let row=0; row<ROWS; row++){
                for(let col=0; col<COLS; col++){
                    let x = col*TILE_SIZE;
                    let y = row*TILE_SIZE;
                    if(wallGrid[row][col]){
                        ctx.fillStyle = "#191c3c";
                        ctx.fillRect(x,y,TILE_SIZE-0.5,TILE_SIZE-0.5);
                        ctx.fillStyle = "#2a2e5a";
                        ctx.fillRect(x+3,y+3,TILE_SIZE-6,TILE_SIZE-6);
                        ctx.fillStyle = "#0e1022";
                        ctx.fillRect(x+6,y+6,TILE_SIZE-12,TILE_SIZE-12);
                    } else {
                        let gradient = ctx.createLinearGradient(x,y,x+TILE_SIZE,y+TILE_SIZE);
                        gradient.addColorStop(0,"#1b2a3a");
                        gradient.addColorStop(1,"#14212e");
                        ctx.fillStyle = gradient;
                        ctx.fillRect(x,y,TILE_SIZE-0.5,TILE_SIZE-0.5);
                        ctx.fillStyle = "#2d4a6b33";
                        ctx.fillRect(x+2,y+2,TILE_SIZE-4,TILE_SIZE-4);
                    }
                }
            }
            
            for(let row=0; row<ROWS; row++){
                for(let col=0; col<COLS; col++){
                    if(keysGrid[row][col]){
                        let x = col*TILE_SIZE;
                        let y = row*TILE_SIZE;
                        ctx.font = `${TILE_SIZE - 8}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.shadowBlur = 5;
                        ctx.fillStyle = "#f5cb5c";
                        ctx.fillText("🔑", x + TILE_SIZE/2, y + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    }
                }
            }
            
            if(doorPos.x >= 0){
                let x = doorPos.x*TILE_SIZE;
                let y = doorPos.y*TILE_SIZE;
                if(doorUnlocked){
                    ctx.fillStyle = "#e4c87b";
                    ctx.shadowBlur = 8;
                    ctx.fillRect(x+5,y+5,TILE_SIZE-10,TILE_SIZE-10);
                    ctx.fillStyle = "#f3e3a2";
                    ctx.fillRect(x+10,y+15,TILE_SIZE-20,8);
                    ctx.fillStyle = "#c9ae5a";
                    ctx.beginPath();
                    ctx.arc(x+TILE_SIZE/2, y+TILE_SIZE/2-3, 7, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#ffd966";
                    ctx.beginPath();
                    ctx.arc(x+TILE_SIZE/2, y+TILE_SIZE/2-3, 4, 0, Math.PI*2);
                    ctx.fill();
                    ctx.font = `${TILE_SIZE - 12}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.fillStyle = "#ffffffcc";
                    ctx.fillText("🚪", x + TILE_SIZE/2, y + TILE_SIZE/2);
                } else {
                    ctx.fillStyle = "#7e5c3c";
                    ctx.fillRect(x+5,y+5,TILE_SIZE-10,TILE_SIZE-10);
                    ctx.fillStyle = "#b8862d";
                    ctx.fillRect(x+13,y+8,14,24);
                    ctx.fillStyle = "#c99e48";
                    ctx.beginPath();
                    ctx.ellipse(x+TILE_SIZE/2, y+12, 6, 8, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#4a2e1a";
                    ctx.fillRect(x+18,y+20,5,14);
                    ctx.font = `${TILE_SIZE - 12}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.fillStyle = "#d4a55a";
                    ctx.fillText("🚪", x + TILE_SIZE/2, y + TILE_SIZE/2);
                }
                ctx.shadowBlur = 0;
            }
            
            for(let e of enemies){
                let x = e.x*TILE_SIZE;
                let y = e.y*TILE_SIZE;
                ctx.font = `${TILE_SIZE - 6}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 4;
                ctx.fillStyle = "#ffffff";
                ctx.fillText(ENEMY_EMOJIS[e.type], x + TILE_SIZE/2, y + TILE_SIZE/2);
                ctx.shadowBlur = 0;
            }
            
            let px = player.x*TILE_SIZE;
            let py = player.y*TILE_SIZE;
            ctx.font = `${TILE_SIZE - 4}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 6;
            ctx.fillStyle = "#f5d742";
            ctx.shadowColor = "#ffcc44";
            ctx.fillText(PLAYER_EMOJI, px + TILE_SIZE/2, py + TILE_SIZE/2);
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";
            
            if(!gameActive && !victory && gameOverFlag){
                ctx.font = "bold 36 monospace";
                ctx.fillStyle = "#ee4444";
                ctx.fillText("GAME OVER", canvas.width/2-100, 50);
            }
            if(victory){
                ctx.font = "bold 36 monospace";
                ctx.fillStyle = "#ffd966";
                ctx.fillText("VITÓRIA!", canvas.width/2-70, 50);
            }
        }
        
        let lastTimestamp = 0;
        function gameLoop(timestamp){
            if(!gameActive || victory){
                draw();
                requestAnimationFrame(gameLoop);
                return;
            }
            
            updateEnemies(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Controle usando setas do teclado
        function handleKey(e){
            let key = e.key;
            if(key === 'ArrowUp') {
                e.preventDefault();
                tryMovePlayer(0, -1);
            }
            else if(key === 'ArrowDown') {
                e.preventDefault();
                tryMovePlayer(0, 1);
            }
            else if(key === 'ArrowLeft') {
                e.preventDefault();
                tryMovePlayer(-1, 0);
            }
            else if(key === 'ArrowRight') {
                e.preventDefault();
                tryMovePlayer(1, 0);
            }
        }
        
        window.addEventListener('keydown', handleKey);
        document.getElementById('resetButton').addEventListener('click', ()=>{
            initGame();
            gameActive=true;
            victory=false;
            gameOverFlag=false;
            doorUnlocked = false;
            keysCollected=0;
            updateKeyUI();
            document.getElementById("gameMessage").innerHTML = "🔓 Colete 4 chaves e fuja pela porta!";
            document.getElementById("gameMessage").classList.remove("victory");
        });
        
        initGame();
        updateKeyUI();
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
